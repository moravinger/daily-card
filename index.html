<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://*.supabase.co; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>Daily Card</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --surface: rgba(25, 25, 29, 0.82);
        --surface-solid: #1b1b20;
        --surface-soft: #23232a;
        --text: #f4f0e8;
        --muted: #a5a1a0;
        --quiet: #77747a;
        --accent: #8b6cff;
        --accent-strong: #7657ef;
        --success: #70d99b;
        --danger: #ff8c8c;
        --stroke: rgba(255, 255, 255, 0.1);
        --shadow: rgba(0, 0, 0, 0.42);
        --ambient-mask: rgba(11, 11, 13, 0.55);
        --ambient-fade: rgba(11, 11, 13, 0.36);
        --ambient-opacity: 0.16;
        --glass: rgba(27, 27, 32, 0.78);
        --glass-deep: rgba(11, 11, 13, 0.55);
        --shimmer: rgba(255, 255, 255, 0.07);
        --sealed-border: rgba(139, 108, 255, 0.28);
        --sealed-glow: rgba(139, 108, 255, 0.32);
        --sealed-start: #252039;
        --sealed-end: #17171d;
        --sealed-pattern: rgba(255, 255, 255, 0.05);
        --seal-border: rgba(255, 255, 255, 0.18);
        --seal-shadow: rgba(139, 108, 255, 0.34);
        --on-accent: #fff;
        --error-text: #d7d3cd;
        --toast-bg: rgba(31, 31, 36, 0.96);
        --modal-backdrop: rgba(0, 0, 0, 0.91);
        --admin-bg: #121216;
        --admin-shadow: rgba(0, 0, 0, 0.52);
        --preview-border: rgba(255, 255, 255, 0.2);
        --field-label: #dad6d0;
        --warning: #f5b84b;
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f4f1eb;
        --surface: rgba(255, 255, 255, 0.78);
        --surface-solid: #ffffff;
        --surface-soft: #eae6df;
        --text: #211f24;
        --muted: #68636a;
        --quiet: #8a858c;
        --accent: #7657ef;
        --accent-strong: #6344dc;
        --success: #187849;
        --danger: #b42318;
        --stroke: rgba(42, 36, 48, 0.13);
        --shadow: rgba(57, 45, 67, 0.17);
        --ambient-mask: rgba(244, 241, 235, 0.58);
        --ambient-fade: rgba(244, 241, 235, 0.42);
        --ambient-opacity: 0.12;
        --glass: rgba(255, 255, 255, 0.78);
        --glass-deep: rgba(255, 255, 255, 0.72);
        --shimmer: rgba(118, 87, 239, 0.09);
        --sealed-border: rgba(118, 87, 239, 0.24);
        --sealed-glow: rgba(118, 87, 239, 0.2);
        --sealed-start: #e7e0fb;
        --sealed-end: #f8f5ff;
        --sealed-pattern: rgba(72, 58, 91, 0.07);
        --seal-border: rgba(255, 255, 255, 0.56);
        --seal-shadow: rgba(118, 87, 239, 0.24);
        --on-accent: #fff;
        --error-text: #625c64;
        --toast-bg: rgba(255, 255, 255, 0.96);
        --modal-backdrop: rgba(24, 20, 28, 0.72);
        --admin-bg: #fbf9f5;
        --admin-shadow: rgba(47, 37, 55, 0.2);
        --preview-border: rgba(42, 36, 48, 0.24);
        --field-label: #4d4850;
        --warning: #c98200;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      button,
      input {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body.modal-open {
        overflow: hidden;
      }

      #ambient-background {
        position: fixed;
        inset: -64px;
        z-index: -2;
        background-position: center;
        background-size: cover;
        filter: blur(58px) saturate(0.78);
        opacity: var(--ambient-opacity);
        transform: scale(1.15);
        transition: background-image 0.6s ease, opacity 0.6s ease;
      }

      #ambient-background::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 32%, transparent 0, var(--ambient-mask) 52%),
          linear-gradient(180deg, var(--ambient-fade), var(--bg) 88%);
      }

      #app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        width: min(100%, 520px);
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        padding:
          max(18px, env(safe-area-inset-top, 0px))
          18px
          max(16px, env(safe-area-inset-bottom, 0px));
      }

      .app-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        padding: 5px 2px 14px;
      }

      .eyebrow {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 340px;
        margin-top: 5px;
        font-size: clamp(26px, 7vw, 34px);
        line-height: 1.04;
        letter-spacing: -0.04em;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #offline-badge {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border: 1px solid var(--stroke);
        border-radius: 999px;
        background: var(--glass-deep);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        backdrop-filter: blur(14px);
      }

      #offline-badge::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--warning);
        content: '';
      }

      .icon-button {
        display: inline-flex;
        width: 42px;
        height: 42px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--stroke);
        border-radius: 50%;
        background: var(--glass);
        color: var(--text);
        cursor: pointer;
        font-size: 20px;
        backdrop-filter: blur(16px);
      }

      #admin-toggle-button {
        display: none;
      }

      .content {
        display: flex;
        min-height: 0;
        flex-direction: column;
        justify-content: center;
      }

      #loading,
      #card-container,
      #placeholder {
        width: 100%;
      }

      #loading {
        display: none;
      }

      .skeleton-card {
        aspect-ratio: 1.42;
        overflow: hidden;
        border: 1px solid var(--stroke);
        border-radius: 26px;
        background: var(--surface-solid);
      }

      .skeleton-card::after {
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(90deg, transparent, var(--shimmer), transparent);
        animation: shimmer 1.35s ease-in-out infinite;
        content: '';
        transform: translateX(-120%);
      }

      .skeleton-line {
        width: 70%;
        height: 13px;
        margin: 18px auto 0;
        border-radius: 999px;
        background: var(--shimmer);
      }

      @keyframes shimmer {
        to { transform: translateX(340%); }
      }

      #card-container {
        display: none;
        flex-direction: column;
      }

      #reveal-cover {
        display: none;
        text-align: center;
      }

      .sealed-card {
        position: relative;
        display: grid;
        aspect-ratio: 1.42;
        overflow: hidden;
        place-items: center;
        border: 1px solid var(--sealed-border);
        border-radius: 26px;
        background:
          radial-gradient(circle at 50% 48%, var(--sealed-glow), transparent 33%),
          linear-gradient(145deg, var(--sealed-start), var(--sealed-end) 68%);
        box-shadow: 0 28px 80px var(--shadow);
      }

      .sealed-card::before {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(45deg, transparent 46%, var(--sealed-pattern) 48%, transparent 52%),
          linear-gradient(-45deg, transparent 46%, var(--sealed-pattern) 48%, transparent 52%);
        background-size: 42px 42px;
        content: '';
        mask-image: linear-gradient(to bottom, black, transparent);
      }

      .seal {
        position: relative;
        display: grid;
        width: 92px;
        height: 92px;
        place-items: center;
        border: 1px solid var(--seal-border);
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 16px 46px var(--seal-shadow);
        font-size: 36px;
      }

      .reveal-copy {
        margin: 18px 0 14px;
        color: var(--muted);
        font-size: 15px;
      }

      .primary-button,
      .secondary-button {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 16px;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.16s ease, background 0.16s ease;
      }

      .primary-button {
        border: 0;
        background: var(--accent);
        color: var(--on-accent);
      }

      .secondary-button {
        border: 1px solid var(--stroke);
        background: var(--glass);
        color: var(--text);
      }

      .primary-button:active,
      .secondary-button:active,
      .icon-button:active {
        transform: scale(0.97);
      }

      #reveal-button {
        width: 100%;
      }

      #revealed-content {
        display: none;
      }

      #card-open-button {
        display: block;
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--stroke);
        border-radius: 26px;
        background: var(--surface);
        box-shadow: 0 28px 80px var(--shadow);
        cursor: zoom-in;
      }

      #card-image {
        display: block;
        width: 100%;
        max-height: 56vh;
        max-height: 56dvh;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.45s ease, transform 0.2s ease;
      }

      #card-open-button:active #card-image {
        transform: scale(0.99);
      }

      #card-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      #card-actions button {
        min-width: 0;
      }

      .action-icon {
        font-size: 18px;
      }

      .revealing #reveal-cover {
        animation: reveal-away 0.48s ease both;
      }

      .reveal-entering #revealed-content {
        animation: reveal-in 0.52s ease both;
      }

      @keyframes reveal-away {
        to { opacity: 0; transform: scale(0.88) rotate(1deg); }
      }

      @keyframes reveal-in {
        from { opacity: 0; transform: translateY(16px) scale(0.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      #placeholder {
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 38px 24px;
        border: 1px solid var(--stroke);
        border-radius: 26px;
        background: var(--surface);
        text-align: center;
      }

      .placeholder-symbol {
        display: grid;
        width: 78px;
        height: 78px;
        place-items: center;
        border-radius: 22px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 32px;
      }

      #placeholder-text {
        margin-top: 16px;
        color: var(--muted);
        font-size: 15px;
      }

      #error {
        display: none;
        margin-top: 16px;
        text-align: center;
      }

      #error-message {
        color: var(--error-text);
        font-size: 14px;
        line-height: 1.45;
      }

      #retry-button {
        min-height: 44px;
        margin-top: 14px;
        padding: 0 20px;
      }

      .app-footer {
        padding-top: 13px;
        color: var(--quiet);
        font-size: 12px;
        text-align: center;
      }

      #toast {
        position: fixed;
        bottom: max(24px, env(safe-area-inset-bottom, 0px));
        left: 50%;
        z-index: 1400;
        max-width: calc(100% - 32px);
        padding: 11px 16px;
        border: 1px solid var(--stroke);
        border-radius: 999px;
        background: var(--toast-bg);
        box-shadow: 0 12px 36px var(--shadow);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 12px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        white-space: nowrap;
      }

      #toast.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      #card-preview {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1200;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      }

      #card-preview.visible {
        display: flex;
      }

      .modal-backdrop {
        position: absolute;
        inset: 0;
        border: 0;
        background: var(--modal-backdrop);
      }

      #preview-image {
        position: relative;
        z-index: 1;
        max-width: 100%;
        max-height: 92vh;
        max-height: 92dvh;
        border-radius: 16px;
        object-fit: contain;
      }

      #preview-close-button {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: 16px;
        z-index: 2;
      }

      #admin-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1300;
        align-items: flex-end;
        justify-content: center;
      }

      #admin-overlay.visible {
        display: flex;
      }

      #admin-panel {
        position: relative;
        z-index: 1;
        width: min(100%, 560px);
        max-height: calc(100dvh - max(16px, env(safe-area-inset-top)));
        overflow-y: auto;
        padding: 18px 18px max(20px, env(safe-area-inset-bottom));
        border: 1px solid var(--stroke);
        border-bottom: 0;
        border-radius: 28px 28px 0 0;
        background: var(--admin-bg);
        box-shadow: 0 -24px 80px var(--admin-shadow);
      }

      .admin-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .admin-header h2 {
        margin-top: 4px;
        font-size: 25px;
        letter-spacing: -0.03em;
      }

      #admin-preview {
        position: relative;
        display: grid;
        aspect-ratio: 1.62;
        overflow: hidden;
        place-items: center;
        border: 1px dashed var(--preview-border);
        border-radius: 20px;
        background: var(--surface-solid);
      }

      #admin-preview-image {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #admin-preview-empty {
        color: var(--muted);
        text-align: center;
      }

      .preview-plus {
        display: block;
        margin-bottom: 8px;
        font-size: 30px;
      }

      #upload-form {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }

      .field-group {
        display: grid;
        gap: 7px;
      }

      .field-label {
        color: var(--field-label);
        font-size: 13px;
        font-weight: 650;
      }

      #upload-form input {
        width: 100%;
        min-height: 48px;
        padding: 12px;
        border: 1px solid var(--stroke);
        border-radius: 14px;
        background: var(--surface-solid);
        color: var(--text);
        font-size: 15px;
      }

      #upload-form input[type='file'] {
        padding: 9px;
      }

      #upload-form input[type='file']::file-selector-button {
        min-height: 32px;
        margin-right: 10px;
        padding: 0 12px;
        border: 0;
        border-radius: 10px;
        background: var(--surface-soft);
        color: var(--text);
      }

      #upload-form input[type='date'] {
        -webkit-text-fill-color: var(--text);
        opacity: 1;
      }

      #upload-form input[type='date']::-webkit-date-and-time-value,
      #upload-form input[type='date']::-webkit-datetime-edit {
        color: var(--text);
        -webkit-text-fill-color: var(--text);
        text-align: left;
        opacity: 1;
      }

      #file-meta {
        color: var(--quiet);
        font-size: 12px;
      }

      #upload-submit {
        width: 100%;
      }

      #upload-submit:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      #upload-status {
        display: none;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--surface-solid);
        font-size: 14px;
        text-align: center;
      }

      #upload-status.success {
        color: var(--success);
      }

      #upload-status.error {
        color: var(--danger);
      }

      @media (hover: hover) {
        .primary-button:hover {
          background: var(--accent-strong);
        }

        .secondary-button:hover,
        .icon-button:hover {
          background: var(--surface-soft);
        }
      }

      @media (max-height: 690px) {
        .app-header {
          padding-bottom: 9px;
        }

        h1 {
          font-size: 25px;
        }

        .sealed-card {
          aspect-ratio: 1.72;
        }

        .seal {
          width: 72px;
          height: 72px;
          font-size: 29px;
        }

        #card-image {
          max-height: 46dvh;
        }

        .app-footer {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script
      src="https://telegram.org/js/telegram-web-app.js"
      integrity="sha384-UIU2aXwkvBIU//NSd8KQvPQc3/EvwMoKj+m2qYgtQAtF1u3Vvhf5+pjstVoLvU3i"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="ambient-background" aria-hidden="true"></div>

    <div id="app">
      <header class="app-header">
        <div>
          <p class="eyebrow" id="card-date-label">Сегодня</p>
          <h1 id="screen-title">Твоя карточка на сегодня</h1>
        </div>
        <div class="header-actions">
          <span id="offline-badge">Сохранённая</span>
          <button id="admin-toggle-button" class="icon-button" type="button" aria-label="Открыть управление">
            ⚙
          </button>
        </div>
      </header>

      <main class="content">
        <div id="loading" role="status" aria-label="Загружаем карточку">
          <div class="skeleton-card"></div>
          <div class="skeleton-line" aria-hidden="true"></div>
        </div>

        <section id="card-container" aria-label="Карточка дня">
          <div id="reveal-cover">
            <div class="sealed-card" aria-hidden="true">
              <span class="seal">✦</span>
            </div>
            <p class="reveal-copy">Одна карточка. Один момент для себя.</p>
            <button id="reveal-button" class="primary-button" type="button">Открыть карточку</button>
          </div>

          <div id="revealed-content">
            <button id="card-open-button" type="button" aria-label="Открыть карточку на весь экран">
              <img id="card-image" alt="Карточка дня" decoding="async" />
            </button>
            <div id="card-actions">
              <button id="share-button" class="primary-button" type="button">
                <span class="action-icon" aria-hidden="true">↗</span>
                Поделиться
              </button>
              <button id="save-button" class="secondary-button" type="button">
                <span class="action-icon" aria-hidden="true">↓</span>
                Сохранить
              </button>
            </div>
          </div>
        </section>

        <div id="placeholder">
          <span class="placeholder-symbol" aria-hidden="true">✦</span>
          <p id="placeholder-text">Карточка пока недоступна</p>
        </div>

        <div id="error" role="alert" aria-live="polite">
          <p id="error-message"></p>
          <button id="retry-button" class="primary-button" type="button">Попробовать снова</button>
        </div>
      </main>

      <footer class="app-footer" id="app-footer">Новая карточка каждый день</footer>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="card-preview" aria-hidden="true">
      <button id="preview-backdrop" class="modal-backdrop" type="button" aria-label="Закрыть просмотр"></button>
      <img id="preview-image" alt="Карточка дня в полном размере" />
      <button id="preview-close-button" class="icon-button" type="button" aria-label="Закрыть">×</button>
    </div>

    <div id="admin-overlay" aria-hidden="true">
      <button id="admin-backdrop" class="modal-backdrop" type="button" aria-label="Закрыть управление"></button>
      <section id="admin-panel" role="dialog" aria-modal="true" aria-labelledby="admin-title">
        <header class="admin-header">
          <div>
            <p class="eyebrow">Управление контентом</p>
            <h2 id="admin-title">Новая карточка</h2>
          </div>
          <button id="admin-close-button" class="icon-button" type="button" aria-label="Закрыть">×</button>
        </header>

        <div id="admin-preview">
          <img id="admin-preview-image" alt="Предварительный просмотр выбранной карточки" />
          <p id="admin-preview-empty"><span class="preview-plus">＋</span>Превью появится здесь</p>
        </div>

        <form id="upload-form">
          <label class="field-group" for="file-input">
            <span class="field-label">Изображение</span>
            <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" required />
            <span id="file-meta">JPEG, PNG или WebP · до 5 МБ</span>
          </label>

          <label class="field-group" for="date-input">
            <span class="field-label">Дата публикации</span>
