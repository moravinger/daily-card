<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>Daily Card</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0b0d;
        --surface: rgba(25, 27, 32, 0.82);
        --surface-strong: #1a1c21;
        --text: #f7f7f8;
        --muted: #9da2ad;
        --accent: #7c5cff;
        --accent-strong: #6747ef;
        --stroke: rgba(255, 255, 255, 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      button {
        font: inherit;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, 'Helvetica Neue', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      body.preview-open {
        overflow: hidden;
      }

      #ambient-background {
        position: fixed;
        inset: -48px;
        z-index: -2;
        background-position: center;
        background-size: cover;
        filter: blur(48px) saturate(0.8);
        opacity: 0.18;
        transform: scale(1.12);
        transition: background-image 0.5s ease;
      }

      #ambient-background::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(10, 11, 13, 0.68), var(--bg) 78%);
      }

      #app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        width: min(100%, 520px);
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        padding:
          max(18px, env(safe-area-inset-top, 0px))
          16px
          max(18px, env(safe-area-inset-bottom, 0px));
      }

      .app-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 4px 2px 16px;
      }

      .eyebrow {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin-top: 4px;
        font-size: clamp(25px, 7vw, 32px);
        line-height: 1.05;
        letter-spacing: -0.035em;
      }

      #offline-badge {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border: 1px solid var(--stroke);
        border-radius: 999px;
        background: rgba(10, 11, 13, 0.5);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        backdrop-filter: blur(12px);
      }

      #offline-badge::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f5a524;
      }

      .content {
        display: flex;
        min-height: 0;
        flex-direction: column;
        justify-content: center;
      }

      #loading,
      #card-container,
      #placeholder {
        width: 100%;
      }

      #loading {
        display: none;
      }

      .skeleton-card {
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border: 1px solid var(--stroke);
        border-radius: 20px;
        background: var(--surface-strong);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }

      .skeleton-card::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.07),
          transparent
        );
        animation: shimmer 1.35s ease-in-out infinite;
        transform: translateX(-120%);
      }

      .skeleton-lines {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .skeleton-line {
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
      }

      .skeleton-line:last-child {
        width: 62%;
      }

      @keyframes shimmer {
        to { transform: translateX(320%); }
      }

      #card-container {
        display: none;
      }

      #card-open-button {
        display: block;
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--stroke);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.4);
        cursor: zoom-in;
        -webkit-tap-highlight-color: transparent;
      }

      #card-image {
        display: block;
        width: 100%;
        max-height: 58vh;
        max-height: 58dvh;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.5s ease-in-out, transform 0.25s ease;
      }

      #card-open-button:active #card-image {
        transform: scale(0.99);
      }

      #card-actions {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .action-button,
      #retry-button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--stroke);
        border-radius: 14px;
        background: rgba(27, 29, 34, 0.78);
        color: var(--text);
        cursor: pointer;
        font-weight: 650;
        backdrop-filter: blur(16px);
        transition: transform 0.16s ease, background 0.16s ease;
      }

      .action-button:active,
      #retry-button:active {
        transform: scale(0.97);
      }

      .action-button.primary {
        border-color: transparent;
        background: var(--accent);
      }

      .action-icon {
        font-size: 18px;
        line-height: 1;
      }

      #placeholder {
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 34px 22px;
        border: 1px solid var(--stroke);
        border-radius: 20px;
        background: var(--surface);
        text-align: center;
      }

      #fallback-image {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        opacity: 0.62;
      }

      #placeholder-text {
        margin-top: 16px;
        color: var(--muted);
        font-size: 15px;
      }

      #error {
        display: none;
        margin-top: 16px;
        text-align: center;
      }

      #error-message {
        color: #d4d6dc;
        font-size: 14px;
        line-height: 1.45;
      }

      #retry-button {
        min-height: 44px;
        margin-top: 14px;
        padding: 0 20px;
        background: var(--accent);
      }

      .app-footer {
        padding-top: 14px;
        color: #737985;
        font-size: 12px;
        text-align: center;
      }

      #toast {
        position: fixed;
        bottom: max(24px, env(safe-area-inset-bottom, 0px));
        left: 50%;
        z-index: 1200;
        max-width: calc(100% - 32px);
        padding: 11px 16px;
        border: 1px solid var(--stroke);
        border-radius: 999px;
        background: rgba(30, 32, 38, 0.96);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.38);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 12px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        white-space: nowrap;
      }

      #toast.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      #card-preview {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1100;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      }

      #card-preview.visible {
        display: flex;
      }

      #preview-backdrop {
        position: absolute;
        inset: 0;
        border: 0;
        background: rgba(0, 0, 0, 0.92);
        cursor: zoom-out;
      }

      #preview-image {
        position: relative;
        z-index: 1;
        max-width: 100%;
        max-height: 92vh;
        max-height: 92dvh;
        border-radius: 12px;
        object-fit: contain;
      }

      #preview-close-button {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: 16px;
        z-index: 2;
        width: 44px;
        height: 44px;
        border: 1px solid var(--stroke);
        border-radius: 50%;
        background: rgba(28, 29, 34, 0.86);
        color: #fff;
        cursor: pointer;
        font-size: 22px;
      }

      #admin-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.95);
        padding: 20px;
        border-top: 1px solid #333;
        max-height: 50vh;
        overflow-y: auto;
        display: none;
        z-index: 1000;
      }

      #admin-panel.visible {
        display: block;
      }

      #upload-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #upload-form input,
      #upload-form button {
        padding: 12px;
        border: 1px solid #444;
        background: #1a1a1a;
        color: #fff;
        border-radius: 4px;
        font-size: 14px;
      }

      #upload-form input[type='file'] {
        cursor: pointer;
      }

      #upload-form input[type='date'] {
        width: 100%;
        min-height: 44px;
        color: #fff;
        color-scheme: dark;
        -webkit-text-fill-color: #fff;
        opacity: 1;
      }

      #upload-form input[type='date']::-webkit-date-and-time-value,
      #upload-form input[type='date']::-webkit-datetime-edit {
        color: #fff;
        -webkit-text-fill-color: #fff;
        text-align: left;
        opacity: 1;
      }

      #upload-form input[type='date']::-webkit-calendar-picker-indicator {
        cursor: pointer;
        filter: invert(1);
        opacity: 0.85;
      }

      #upload-form button {
        background: #007AFF;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s;
      }

      #upload-form button:hover {
        background: #0051cc;
      }

      #upload-form button:active {
        background: #003d99;
      }

      #upload-form button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #upload-status {
        display: none;
        margin-top: 12px;
        text-align: center;
        font-size: 14px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }

      #admin-toggle-container {
        display: none; /* Скрыто по умолчанию */
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1001;
      }

      #admin-toggle-button {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #007AFF;
        border: none;
        font-size: 24px;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        transition: transform 0.2s ease-in-out;
      }

      #admin-toggle-button:hover {
        transform: scale(1.05);
      }

      @media (hover: hover) {
        .action-button:hover,
        #retry-button:hover {
          background: #30333a;
        }

        .action-button.primary:hover,
        #retry-button:hover {
          background: var(--accent-strong);
        }
      }

      @media (max-height: 660px) {
        .app-header {
          padding-bottom: 10px;
        }

        h1 {
          font-size: 24px;
        }

        #card-image {
          max-height: 48dvh;
        }

        .app-footer {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script
      src="https://telegram.org/js/telegram-web-app.js"
      integrity="sha384-UIU2aXwkvBIU//NSd8KQvPQc3/EvwMoKj+m2qYgtQAtF1u3Vvhf5+pjstVoLvU3i"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="ambient-background" aria-hidden="true"></div>

    <div id="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Каждый день</p>
          <h1>Карточка дня</h1>
        </div>
        <span id="offline-badge">Сохранённая</span>
      </header>

      <main class="content">
        <div id="loading" role="status" aria-label="Загружаем карточку">
          <div class="skeleton-card"></div>
          <div class="skeleton-lines" aria-hidden="true">
            <span class="skeleton-line"></span>
            <span class="skeleton-line"></span>
          </div>
        </div>

        <div id="card-container">
          <button id="card-open-button" type="button" aria-label="Открыть карточку на весь экран">
            <img id="card-image" alt="Карточка дня" decoding="async" />
          </button>
          <div id="card-actions">
            <button id="share-button" class="action-button primary" type="button">
              <span class="action-icon" aria-hidden="true">↗</span>
              Поделиться
            </button>
            <button id="save-button" class="action-button" type="button">
              <span class="action-icon" aria-hidden="true">↓</span>
              Сохранить
            </button>
          </div>
        </div>

        <div id="placeholder">
          <img id="fallback-image" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect rx='22' fill='%2324262c' width='100' height='100'/%3E%3Ctext x='50' y='52' font-size='38' fill='%23888e9a' text-anchor='middle' dominant-baseline='middle'%3E✦%3C/text%3E%3C/svg%3E" />
          <p id="placeholder-text">Карточка пока недоступна</p>
        </div>

        <div id="error" role="alert" aria-live="polite">
          <p id="error-message"></p>
          <button id="retry-button" type="button">Попробовать снова</button>
        </div>
      </main>

      <footer class="app-footer">
        <span id="card-date"></span> · новая карточка каждый день
      </footer>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="card-preview" aria-hidden="true">
      <button id="preview-backdrop" type="button" aria-label="Закрыть просмотр"></button>
      <img id="preview-image" alt="Карточка дня в полном размере" />
      <button id="preview-close-button" type="button" aria-label="Закрыть">×</button>
    </div>

    <div id="admin-panel">
      <h3 style="margin-bottom: 12px">Админ-панель</h3>
      <form id="upload-form">
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" required />
        <input type="date" id="date-input" required />
        <button type="submit">Загрузить карточку</button>
      </form>
      <div id="upload-status"></div>
    </div>

    <div id="admin-toggle-container">
      <button id="admin-toggle-button" type="button" aria-label="Открыть админ-панель">⚙️</button>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
